name: CI (develop)

# GitHub Actions is non-TTY; these make Node/Next (chalk) and similar tools emit ANSI colors
# that render in the Actions log viewer.
env:
  FORCE_COLOR: "1"
  TERM: xterm-256color

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-dev"
  cancel-in-progress: true

jobs:
  format:
    name: JS Code Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          path: pycon-website
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install node dependencies
        run: |
          cd pycon-website/
          npm install
      - name: Show node environment
        run: |
          node --version
          npm --version
      - name: Run JS lint
        run: |
          cd pycon-website/
          npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup nodeJS
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Set build environment
        shell: bash
        run: |
          GA_ID="${{ vars.NEXT_PUBLIC_GA_ID }}"
          if [ -z "$GA_ID" ]; then
            GA_ID="${{ secrets.NEXT_PUBLIC_GA_ID }}"
          fi
          if [ -n "$GA_ID" ]; then
            echo "NEXT_PUBLIC_GA_ID=$GA_ID" >> "$GITHUB_ENV"
          fi
          echo "NEXT_PUBLIC_APP_URL=https://develop.pycon.co" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.CERTIFICATES_JSON_URL }}" ]; then
            echo "CERTIFICATES_JSON_URL=${{ secrets.CERTIFICATES_JSON_URL }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.CERTIFICATES_JSON_URL }}" ]; then
            echo "CERTIFICATES_JSON_URL=${{ vars.CERTIFICATES_JSON_URL }}" >> "$GITHUB_ENV"
          elif [ -n "${{ secrets.CERTIFICATES_DRIVE_FILE_ID }}" ]; then
            echo "CERTIFICATES_DRIVE_FILE_ID=${{ secrets.CERTIFICATES_DRIVE_FILE_ID }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.CERTIFICATES_DRIVE_FILE_ID }}" ]; then
            echo "CERTIFICATES_DRIVE_FILE_ID=${{ vars.CERTIFICATES_DRIVE_FILE_ID }}" >> "$GITHUB_ENV"
          fi
      - name: Typecheck
        run: npm run check-types
      - name: Build project
        run: npm run build
